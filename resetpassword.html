<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieuw wachtwoord — StudyBrain</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#0a0a0f; --surface:#12121a; --card:#1a1a26; --border:#2a2a3d; --accent:#ff4d6d; --green:#00e676; --text:#f0f0f8; --muted:#6b6b8a; }
body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }
.orb { position:fixed; border-radius:50%; pointer-events:none; }
.orb1 { width:500px; height:500px; background:radial-gradient(circle,rgba(255,77,109,0.09) 0%,transparent 70%); top:-200px; right:-100px; }
.logo { font-family:'Syne',sans-serif; font-size:24px; font-weight:800; margin-bottom:36px; text-decoration:none; color:var(--text); }
.box { background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:40px; width:100%; max-width:420px; }
.box h2 { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; margin-bottom:8px; }
.box p { font-size:14px; color:var(--muted); margin-bottom:24px; }
.field { margin-bottom:16px; }
.field label { display:block; font-size:13px; font-weight:500; margin-bottom:6px; color:var(--muted); }
.field input { width:100%; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:13px 16px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:15px; outline:none; transition:border-color 0.2s; }
.field input:focus { border-color:var(--accent); }
.submit-btn { width:100%; padding:15px; background:linear-gradient(135deg,#ff4d6d,#c9184a); border:none; border-radius:14px; color:white; font-family:'Syne',sans-serif; font-size:17px; font-weight:700; cursor:pointer; transition:all 0.3s; }
.submit-btn:disabled { opacity:0.5; cursor:not-allowed; }
.msg { padding:12px 16px; border-radius:10px; font-size:13px; margin-bottom:16px; display:none; line-height:1.5; }
.msg.error { background:rgba(255,77,109,0.12); border:1px solid rgba(255,77,109,0.3); color:#ff8fa3; }
.msg.success { background:rgba(0,230,118,0.1); border:1px solid rgba(0,230,118,0.3); color:var(--green); }
</style>
</head>
<body>
<div class="orb orb1"></div>
<a href="index.html" class="logo">🧠 StudyBrain</a>
<div class="box">
  <h2>Nieuw wachtwoord instellen</h2>
  <p>Kies een nieuw wachtwoord voor je account.</p>
  <div class="msg error" id="resetError"></div>
  <div class="msg success" id="resetSuccess"></div>
  <div class="field"><label>Nieuw wachtwoord</label><input type="password" id="newPassword" placeholder="Minimaal 6 tekens"></div>
  <div class="field"><label>Herhaal wachtwoord</label><input type="password" id="newPassword2" placeholder="Herhaal wachtwoord"></div>
  <button class="submit-btn" id="resetBtn" onclick="doReset()">Wachtwoord opslaan →</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://wtfzqpaectqrbprmxjqp.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0ZnpxcGFlY3RxcmJwcm14anFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzE4NDYsImV4cCI6MjA4ODE0Nzg0Nn0.LeJqnukvUpVJZyG_2pjwS0xnl24ATdV6Mi6qqZeVbJ4';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, storageKey: 'studybrain-auth', storage: window.localStorage, autoRefreshToken: true, detectSessionInUrl: true }
  });

  function showMsg(id, tekst, type) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = tekst;
    el.className = 'msg ' + type;
    el.style.display = 'block';
  }

  async function doReset() {
    const pw1 = document.getElementById('newPassword').value;
    const pw2 = document.getElementById('newPassword2').value;
    if (!pw1 || pw1.length < 6) return showMsg('resetError', 'Wachtwoord minimaal 6 tekens.', 'error');
    if (pw1 !== pw2) return showMsg('resetError', 'Wachtwoorden komen niet overeen.', 'error');
    const btn = document.getElementById('resetBtn');
    btn.disabled = true; btn.textContent = 'Bezig...';
    const { error } = await sb.auth.updateUser({ password: pw1 });
    if (error) {
      showMsg('resetError', 'Er ging iets mis. Probeer de link opnieuw te gebruiken.', 'error');
      btn.disabled = false; btn.textContent = 'Wachtwoord opslaan →';
    } else {
      showMsg('resetSuccess', '✅ Wachtwoord gewijzigd! Je wordt doorgestuurd...', 'success');
      setTimeout(() => window.location.href = 'index.html?ingelogd=1', 2000);
    }
  }
</script>
</body>
</html>
